# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JS syntax
        run: node scripts/check-js.mjs
      - name: Run JS smoke tests
        run: node dist/js/cake-baker.smoke.test.cjs && node dist/js/challenge-client.smoke.test.cjs && node --test dist/js/framework.smoke.test.cjs
      - name: Clone Repository
        run: git clone --depth 1 https://github.com/gpt4free/playground.git
      - name: Checkout documentation source
        run: |
          # docs/ is the source of truth in xtekky/gpt4free. Clone just the
          # Markdown sources and the standard-library publisher.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/xtekky/gpt4free.git /tmp/gpt4free-docs
          git -C /tmp/gpt4free-docs sparse-checkout set docs tools
      - name: Refresh published docs
        run: |
          python3 /tmp/gpt4free-docs/tools/docs_publish.py \
            --source /tmp/gpt4free-docs/docs \
            --target docs \
            --clean
      - name: Build locale routes
        run: node scripts/build-locales.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
