# Syncs every change from this repo (gpt4free/g4f.dev) to the GitHub Pages
# mirror repository (by default hlohaus/hlohaus.github.io).
#
# Pushes CONTENT ONLY: a single commit on top of the mirror's main with this
# repo's files, while the mirror keeps its own .github (workflows) and CNAME.
# This avoids GitHub's "refusing to allow a Personal Access Token to create
# or update workflow" rejection — a PAT without the workflow scope may not
# push workflow files, so none are included in the pushed diff.
#
# Requires the secret PAGES_TOKEN: a personal access token with push
# (contents:write) access to the mirror repository. Because the push uses a
# PAT, it also triggers the mirror's "Deploy static content to Pages"
# workflow, which publishes the update.
name: Sync to Pages mirror

on:
  # Sync on every push to the default branch
  push:
    branches: ["main"]

  # Pull-based syncs on the mirror run every 5 min; this catches anything
  # they miss (e.g. after a failed run) on a schedule too
  schedule:
    - cron: "*/5 * * * *"

  # Run manually from the Actions tab — enter the mirror repo name to sync
  workflow_dispatch:
    inputs:
      repo:
        description: "Mirror repository (owner/name)"
        required: false
        default: "hlohaus/hlohaus.github.io"

permissions:
  contents: read

concurrency:
  group: "pages-mirror-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the workflow's GITHUB_TOKEN as an http extraheader:
          # it would override the PAGES_TOKEN credentials in the push URL and
          # authenticate the mirror push as github-actions[bot] (403).
          persist-credentials: false

      - name: Push all changes to the mirror
        env:
          MIRROR_REPO: ${{ github.event.inputs.repo || 'hlohaus/hlohaus.github.io' }}
          MIRROR_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          # No-op when this file runs in the mirror repo (it gets there via
          # the sync) — only the origin repo pushes to the mirror.
          if [ "$GITHUB_REPOSITORY" != "gpt4free/g4f.dev" ]; then
            echo "Skipping: this workflow only syncs from gpt4free/g4f.dev, not from ${GITHUB_REPOSITORY}."
            exit 0
          fi
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Secret PAGES_TOKEN is not set. Create a personal access token with push access to ${MIRROR_REPO}, then add it as the PAGES_TOKEN secret in this repository's Settings > Secrets > Actions."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git fetch mirror

          # Build a single content commit on top of the mirror's main:
          # upstream's files, but the mirror keeps its own .github (workflows)
          # and CNAME. Content-only, so the PAT needs no workflow scope.
          git checkout -B sync mirror/main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'CNAME' -exec rm -rf {} +
          git checkout "${GITHUB_SHA}" -- . ':(exclude).github'
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date."
            exit 0
          fi
          git commit -m "Sync content from gpt4free/g4f.dev@${GITHUB_SHA::7}"
          git push mirror sync:main
