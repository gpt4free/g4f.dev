<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shooting Birds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#0a0418;
    --neon-cyan:#00f5ff;
    --neon-pink:#ff00aa;
    --neon-yellow:#ffee00;
    --neon-purple:#7700ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-dark);font-family:'Space Grotesk',sans-serif;color:#fff;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #stage{
    position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;
    background:linear-gradient(180deg, #0a0418 0%, #2d1b4e 45%, #10004a 75%, #000 100%);
  }
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}

  /* HUD */
  .hud{position:absolute;z-index:5;pointer-events:none;display:flex;width:100%;padding:20px 24px;justify-content:space-between;align-items:center}
  .stat-box{
    font-family:'Press Start 2P', sans-serif; 
    background:rgba(0,245,255,0.05); border:2px solid var(--neon-cyan);
    padding:10px 14px; border-radius:6px; color:var(--neon-cyan);
    text-shadow:0 0 8px var(--neon-cyan); font-size:12px; letter-spacing:1px;
    box-shadow:0 0 15px rgba(0,245,255,0.2), inset 0 0 8px rgba(0,245,255,0.1);
  }
  .lives{display:flex;gap:6px}
  .life-icon{width:20px;height:24px;background:var(--neon-yellow);clip-path:polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);filter:drop-shadow(0 0 6px var(--neon-yellow))}
  .life-icon.lost{background:#444;filter:none;opacity:0.3}

  /* Screens */
  .screen{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;text-align:center;
    background:rgba(10,4,24,0.8);backdrop-filter:blur(6px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none;transform:scale(1.05)}
  .panel{
    background:rgba(45,27,78,0.9);border:2px solid var(--neon-purple);border-radius:8px;
    padding:32px 24px;max-width:360px;width:100%;
    box-shadow:0 0 20px rgba(119,0,255,0.4), inset 0 0 15px rgba(119,0,255,0.2);
  }
  .title{
    font-family:'Press Start 2P', sans-serif;font-size:clamp(20px,6vw,32px);line-height:1.4;
    color:var(--neon-pink);text-shadow:0 0 10px var(--neon-pink), 3px 3px 0 var(--bg-dark);
    margin-bottom:16px;letter-spacing:1px;
  }
  .subtitle{font-size:12px;font-family:'Press Start 2P',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--neon-cyan);margin-bottom:28px}
  .lead{font-size:15px;line-height:1.5;color:#eee;margin-bottom:28px;font-weight:400}
  .btn{
    font-family:'Press Start 2P', sans-serif;font-size:16px;letter-spacing:1px;
    background:var(--neon-yellow);color:#10004a;border:none;border-radius:4px;
    padding:14px 28px;width:100%;cursor:pointer;
    box-shadow:0 6px 0 #b8a000, 0 0 20px var(--neon-yellow);
    transition:transform .08s ease, box-shadow .08s ease;
    border:2px solid #10004a;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8a000}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  .mini-stat{background:rgba(0,0,0,0.4);padding:12px;border:1px solid #444;border-radius:6px}
  .mini-stat span{font-family:'Press Start 2P',sans-serif;font-size:10px;color:#aaa;display:block;margin-bottom:6px}
  .mini-stat b{font-family:'Press Start 2P',sans-serif;font-size:24px;color:var(--neon-cyan)}

  .hint{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:5;
    font-family:'Press Start 2P', sans-serif;font-size:12px;letter-spacing:1px;color:#fff;
    text-shadow:0 0 8px var(--neon-pink);opacity:0.8;pointer-events:none;
    animation:bob 1.5s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
  .hint.fade{opacity:0;transition:opacity .5s ease}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="stat-box">SCORE: <span id="scoreVal">0</span></div>
    <div class="lives" id="livesDisplay">
      <div class="life-icon"></div>
      <div class="life-icon"></div>
      <div class="life-icon"></div>
    </div>
  </div>

  <div class="hint" id="hint">DRAG TO MOVE<br>AUTO-SHOOT ON</div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="panel">
      <div class="title">SHOOTING<br>BIRDS</div>
      <div class="subtitle">neon sortie</div>
      <div class="lead">Drag your finger or mouse anywhere to fly the neon bird. It shoots auto-lasers. Blast the drones, dodge their shots, and survive the synth-wave night!</div>
      <button class="btn" id="playBtn">LAUNCH</button>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="screen hidden" id="overScreen">
    <div class="panel">
      <div class="title">SYSTEM<br>DOWN</div>
      <div class="subtitle">reboot entity</div>
      <div class="stat-row">
        <div class="mini-stat"><span>SCORE</span><b id="finalScore">0</b></div>
        <div class="mini-stat"><span>BEST</span><b id="finalBest">0</b></div>
      </div>
      <button class="btn" id="retryBtn">RELAUNCH</button>
    </div>
  </div>
</div>

<script>
(()=>{
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);

  function resize(){
    W = cvs.clientWidth = window.innerWidth;
    H = cvs.clientHeight = window.innerHeight;
    cvs.width = W*DPR; cvs.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);
  resize();

  // ---------- Audio (synthwave SFX) ----------
  let AC=null;
  function audio(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
  function shootSfx(){
    try{
      const ac=audio(), t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='square'; o.frequency.setValueAtTime(880,t);
      o.frequency.exponentialRampToValueAtTime(220,t+0.08);
      g.gain.setValueAtTime(0.04,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.1);
    }catch(e){}
  }
  function boomSfx(){
    try{
      const ac=audio(), t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
      f.type='lowpass'; f.frequency.value=400;
      o.type='sawtooth'; o.frequency.setValueAtTime(180,t);
      o.frequency.exponentialRampToValueAtTime(40,t+0.25);
      g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
      o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+0.3);
    }catch(e){}
  }
  function playerHitSfx(){
    try{
      const ac=audio(), t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(110,t);
      o.frequency.exponentialRampToValueAtTime(20,t+0.5);
      g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.6);
    }catch(e){}
  }

  // ---------- Game state ----------
  const STATE = { MENU:0, PLAY:1, OVER:2 };
  let state = STATE.MENU;
  let score = 0;
  let best = +(localStorage.getItem('shootingbirds_best')||0);
  let lives = 3;

  const bird = { x:120, y:0, w:54, h:36, vy:0, targetY:0, cooldown:0, invuln:0 };
  
  let bullets=[], enemies=[], enemyBullets=[], particles=[], stars=[], gridY=0;
  let enemyTimer = 1500; // ms
  let spawnRate = 1400;

  function reset(){
    bird.x = W * 0.2;
    bird.y = H * 0.5;
    bird.targetY = H * 0.5;
    bird.cooldown = 0; bird.invuln = 0;
    bullets=[]; enemies=[]; enemyBullets=[]; particles=[];
    score = 0; lives = 3;
    updateScore(); updateLives();
    enemyTimer = 1500; spawnRate = 1400;
  }

  function updateScore(){ document.getElementById('scoreVal').textContent = score; }
  function updateLives(){
    document.querySelectorAll('.life-icon').forEach((el, i)=>{
      el.classList.toggle('lost', i >= lives);
    });
  }

  // Starfield init
  function initStars(){
    stars=[];
    for(let i=0;i<80;i++){
      stars.push({x:Math.random()*W, y:Math.random()*H*0.8, z:Math.random()*2+0.5, size:Math.random()*2+0.5});
    }
  }
  initStars();
  window.addEventListener('resize', initStars);

  // ---------- Input ----------
  let isDragging = false;
  function onMove(e){
    e.preventDefault();
    const rect = cvs.getBoundingClientRect();
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    bird.targetY = Math.max(bird.h/2, Math.min(H - bird.h/2, y));
  }
  cvs.addEventListener('pointerdown', e=>{ isDragging=true; onMove(e); });
  cvs.addEventListener('pointermove', e=>{ if(isDragging) onMove(e); });
  cvs.addEventListener('pointerup', ()=> isDragging=false);
  cvs.addEventListener('pointerleave', ()=> isDragging=false);

  document.getElementById('playBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});
  document.getElementById('retryBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});

  function startGame(){
    audio();
    reset();
    state = STATE.PLAY;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    const hint = document.getElementById('hint');
    hint.classList.remove('fade');
    setTimeout(()=>hint.classList.add('fade'), 2500);
  }
  function gameOver(){
    state = STATE.OVER; playerHitSfx();
    if(score>best){ best=score; localStorage.setItem('shootingbirds_best',best); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = best;
    document.getElementById('overScreen').classList.remove('hidden');
    // explosion
    for(let i=0;i<40;i++){
      particles.push({x:bird.x, y:bird.y, vx:(Math.random()-0.5)*400, vy:(Math.random()-0.5)*400, size:Math.random()*4+2, color:'#ffee00', life:1});
    }
  }

  function loseLife(){
    lives--; updateLives(); playerHitSfx();
    bird.invuln = 1500; // 1.5 sec invuln
    for(let i=0;i<20;i++){
      particles.push({x:bird.x, y:bird.y, vx:(Math.random()-0.5)*300, vy:(Math.random()-0.5)*300, size:Math.random()*3+1, color:'#ff00aa', life:1});
    }
    if(lives<=0) gameOver();
  }

  function fireBullet(){
    bullets.push({x:bird.x + 20, y:bird.y, w:16, h:4, speed:700});
    shootSfx();
  }

  function spawnEnemy(){
    // Random formation or single fast drone
    const type = Math.random();
    if(type < 0.5){
      // Single drone
      enemies.push({x:W+50, y:Math.random()*(H*0.7)+H*0.1, w:40, h:34, hp:1, speed:120 + Math.random()*60, shootCooldown: 1200 + Math.random()*1000});
    } else {
      // V-Formation
      const baseY = Math.random()*(H*0.6)+H*0.1;
      for(let i=-1;i<=1;i++){
        enemies.push({x:W+50 + Math.abs(i)*50, y:baseY + i*60, w:36, h:30, hp:1, speed:150, shootCooldown: 1500 + Math.random()*500});
      }
    }
  }

  // ---------- Drawing ----------
  function drawBackground(dt){
    // Stars
    stars.forEach(s=>{
      s.x -= s.z * 40 * dt;
      if(s.x < 0){ s.x = W; s.y = Math.random()*H*0.8; }
      ctx.fillStyle = `rgba(255,255,255,${0.5 + s.z*0.2})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    // Synthwave grid
    gridY = (gridY + 150 * dt) % 40;
    ctx.strokeStyle = 'rgba(255,0,170,0.3)';
    ctx.lineWidth = 1;
    for(let y = gridY + H*0.8; y < H; y+=40){
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for(let x = -W/2; x <= W; x+=80){
      const dist = (x - (W/2 - W*0.05)); 
      // simple perspective lines
      ctx.beginPath(); 
      ctx.moveTo(W/2 + dist*0.2, H*0.8); 
      ctx.lineTo(x*2 - W/2 + W/2, H); 
      ctx.stroke();
    }
    // Horizon line
    ctx.strokeStyle = 'rgba(0,245,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H*0.8); ctx.lineTo(W, H*0.8); ctx.stroke();
    // Sun/Circle 
    const grd = ctx.createLinearGradient(0,0,0,H*0.8);
    grd.addColorStop(0, 'rgba(255,238,0,0)');
    grd.addColorStop(1, '#ff00aa');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(W*0.5, H*0.8, 120, Math.PI, 0); ctx.fill();
  }

  function drawBird(){
    if(bird.invuln > 0 && Math.floor(bird.invuln/100) % 2 === 0 && state === STATE.PLAY) return; // blink
    ctx.save();
    ctx.translate(bird.x, bird.y);
    
    // Glow
    ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 15;
    ctx.fillStyle = '#00f5ff';
    // Body
    ctx.beginPath();
    ctx.moveTo(25, 0); // nose
    ctx.lineTo(-15, -15);
    ctx.lineTo(-10, 0);
    ctx.lineTo(-15, 15);
    ctx.closePath();
    ctx.fill();
    
    // Wing
    ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffee00';
    const wingAngle = Math.sin(Date.now()/50) * 10;
    ctx.save(); ctx.rotate(Math.PI/4 + wingAngle * Math.PI/180);
    ctx.fillRect(-15, -5, 20, 8);
    ctx.restore();
    
    // Eye
    ctx.shadowBlur = 0; ctx.fillStyle = '#10004a';
    ctx.beginPath(); ctx.arc(10, -3, 3, 0, Math.PI*2); ctx.fill();
    
    // Engine trail
    ctx.fillStyle = 'rgba(255,0,170,0.6)';
    ctx.fillRect(-25, -4, 12, 8);
    
    ctx.restore();
  }

  function drawBullets(){
    ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    bullets.forEach(b=>{
      ctx.fillRect(b.x, b.y - 2, b.w, 4);
    });
    ctx.shadowBlur = 0;
  }

  function drawEnemies(){
    enemies.forEach(e=>{
      ctx.save(); ctx.translate(e.x, e.y);
      ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff00aa';
      // Drone shape
      ctx.beginPath();
      ctx.moveTo(-e.w/2, -e.h/4);
      ctx.lineTo(0, -e.h/2);
      ctx.lineTo(e.w/2, -e.h/4);
      ctx.lineTo(e.w/2, e.h/4);
      ctx.lineTo(0, e.h/2);
      ctx.lineTo(-e.w/2, e.h/4);
      ctx.closePath(); ctx.fill();
      
      // Red eye
      ctx.shadowBlur = 0; ctx.fillStyle = '#ffee00';
      ctx.beginPath(); ctx.arc(0,0, 6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  function drawEnemyBullets(){
    ctx.shadowColor = '#ff00aa'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff00aa';
    enemyBullets.forEach(b=>{
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.fillStyle = `rgba(255,238,0,${p.life})`; // yellowish boom
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;
    update(dt, now);
    render(dt);
    requestAnimationFrame(loop);
  }

  function update(dt, now){
    if(state === STATE.PLAY){
      // Smooth bird movement
      bird.y += (bird.targetY - bird.y) * 0.2;

      // Auto-fire
      bird.cooldown -= dt * 1000;
      if(bird.cooldown <= 0){
        fireBullet();
        bird.cooldown = 220;
      }

      // Invulnerability countdown
      if(bird.invuln > 0) bird.invuln -= dt * 1000;

      // Bullets
      bullets.forEach(b => b.x += b.speed * dt);
      bullets = bullets.filter(b => b.x < W + 20);

      // Enemy spawning
      enemyTimer -= dt * 1000;
      if(enemyTimer <= 0){
        spawnEnemy();
        enemyTimer = spawnRate;
        // Difficulty scaling
        spawnRate = Math.max(600, spawnRate - 5);
      }

      // Enemies
      enemies.forEach(e=>{
        e.x -= e.speed * dt;
        // Shooting back
        e.shootCooldown -= dt * 1000;
        if(e.shootCooldown <= 0 && e.x < W - 50 && e.x > bird.x + 50){
          enemyBullets.push({x:e.x, y:e.y, vx:-280, vy:(bird.y - e.y)*0.4});
          e.shootCooldown = 1500 + Math.random()*1500;
        }
      });
      enemies = enemies.filter(e => e.x > -60);

      // Enemy bullets movement
      enemyBullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
      enemyBullets = enemyBullets.filter(b => b.x > -20 && b.x < W && b.y > 0 && b.y < H);

      // Collisions: Player Bullets -> Enemies
      for(let i = bullets.length-1; i>=0; i--){
        const b = bullets[i];
        for(let j = enemies.length-1; j>=0; j--){
          const e = enemies[j];
          if(b.x > e.x - e.w/2 && b.x < e.x + e.w/2 && b.y > e.y - e.h/2 && b.y < e.y + e.h/2){
            // Hit!
            enemies.splice(j,1);
            bullets.splice(i,1);
            score += 10; updateScore(); boomSfx();
            // Particles
            for(let k=0;k<10;k++){
              particles.push({x:e.x, y:e.y, vx:(Math.random()-0.5)*200, vy:(Math.random()-0.5)*200, size:3, color:'#ffee00', life:0.5});
            }
            break;
          }
        }
      }

      // Collisions: Enemies -> Player
      if(bird.invuln <= 0){
        enemies.forEach(e=>{
          if(Math.abs(bird.x - e.x) < (bird.w/2 + e.w/2) && Math.abs(bird.y - e.y) < (bird.h/2 + e.h/2)){
            loseLife();
            e.x = -100; // remove the kamikaze
          }
        });
      }

      // Collisions: Enemy Bullets -> Player
      if(bird.invuln <= 0){
        for(let i=enemyBullets.length-1; i>=0; i--){
          const b = enemyBullets[i];
          if(Math.abs(bird.x - b.x) < bird.w/2 && Math.abs(bird.y - b.y) < bird.h/2){
            loseLife();
            enemyBullets.splice(i,1);
          }
        }
      }
    }

    // Particles update
    particles.forEach(p=>{
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt * 1.5;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);
    drawBackground(dt);
    drawParticles();
    drawEnemyBullets();
    drawBullets();
    drawEnemies();
    drawBird();
  }

  // Idle float for bird in menu
  setInterval(()=>{
    if(state === STATE.MENU){
      bird.targetY = H/2 + Math.sin(Date.now()/500)*50;
      bird.y += (bird.targetY - bird.y) * 0.1;
    }
  }, 1000/60);

  bird.y = H/2;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
