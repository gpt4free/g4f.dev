
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4F - Framework</title>
    <link rel="icon" href="dist/img/g4f.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="dist/img/g4f.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="dist/img/g4f.svg">
    <link rel="manifest" href="dist/img/site.webmanifest">
    <style>
        :root {
            --colour-1: #000000;
            --colour-2: #ccc;
            --colour-3: #e4d4ff;
            --colour-4: #f0f0f0;
            --colour-5: #181818;
            --colour-6: #242424;
            --accent: #8b3dff;
            --gradient: #1a1a1a;
            --background: #16101b;
            --size: 70vw;
            --top: 50%;
            --blur: 40px;
            --opacity: 0.6;
        }

        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap");

        /* Body and text color */
        body {
            background: var(--background);
            color: var(--colour-3);
            font-family: "Inter", sans-serif;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-weight: bold;
        }

        /* Container for the main content */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            z-index: 1;
            transition: transform 0.25s ease-in;
            padding-right: 320px;
        }

        .container.slide {
            transform: translateX(-100%);
            transition: transform 0.15s ease-out;
        }

        /* ---- Advertising sidebar ---- */
        .ad-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background: rgba(22, 16, 27, 0.92);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(139, 61, 255, 0.2);
            z-index: 900;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .ad-sidebar.collapsed {
            transform: translateX(320px);
        }

        .ad-sidebar-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(139, 61, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ad-sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, var(--accent), #c87fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ad-sidebar-count {
            font-size: 0.75rem;
            color: var(--colour-2);
            background: rgba(139, 61, 255, 0.15);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .ad-sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 320px;
            transform: translateY(-50%);
            background: rgba(139, 61, 255, 0.8);
            border: none;
            border-radius: 8px 0 0 8px;
            color: white;
            cursor: pointer;
            padding: 12px 6px;
            z-index: 901;
            transition: right 0.3s ease, background 0.2s ease;
            writing-mode: vertical-rl;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ad-sidebar-toggle.collapsed {
            right: 0;
        }

        .ad-sidebar-toggle:hover {
            background: var(--accent);
        }

        .ad-sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
        }

        .ad-sidebar-body::-webkit-scrollbar {
            width: 4px;
        }
        .ad-sidebar-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .ad-sidebar-body::-webkit-scrollbar-thumb {
            background: rgba(139, 61, 255, 0.3);
            border-radius: 4px;
        }

        .ad-provider-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--colour-3);
            transition: background 0.2s ease, transform 0.15s ease;
            margin-bottom: 4px;
        }

        .ad-provider-item:hover {
            background: rgba(139, 61, 255, 0.12);
            transform: translateX(-3px);
        }

        .ad-provider-logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .ad-provider-info {
            flex: 1;
            min-width: 0;
        }

        .ad-provider-name {
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-provider-badges {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }

        .ad-badge {
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .ad-badge.image { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .ad-badge.vision { background: rgba(40, 167, 69, 0.2); color: #28a745; }
        .ad-badge.video { background: rgba(220, 53, 69, 0.2); color: #dc3545; }
        .ad-badge.audio { background: rgba(23, 162, 184, 0.2); color: #17a2b8; }
        .ad-badge.auth { background: rgba(108, 117, 125, 0.2); color: #adb5bd; }

        .ad-sidebar-footer {
            padding: 0.75rem 1.5rem;
            border-top: 1px solid rgba(139, 61, 255, 0.15);
            text-align: center;
        }

        .ad-sidebar-footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .ad-sidebar-footer a:hover {
            text-decoration: underline;
        }

        .ad-loading {
            text-align: center;
            padding: 2rem;
            color: var(--colour-2);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .ad-sidebar { width: 260px; }
            .ad-sidebar.collapsed { transform: translateX(260px); }
            .ad-sidebar-toggle { right: 260px; }
            .ad-sidebar-toggle.collapsed { right: 0; }
            .container { padding-right: 0; }
        }

        .slide-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--colour-4);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 6px 8px;
        }

        header {
            font-size: 3rem;
            text-transform: uppercase;
            margin: 20px;
            color: var(--colour-4);
        }

        iframe {
            background: transparent;
            width: 100%;
            border: none;
        }

        #background {
            height: 100%;
            position: absolute;
            object-fit: cover;
            object-position: center;
            width: 100%;
            background: black;
        }

        .container * {
            z-index: 2;
        }

        .description {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: var(--colour-2);
        }

        .button {
            background-color: var(--accent);
            color: var(--colour-3);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 15px;
            width: 100%;
            max-width: 400px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .button:hover {
            background-color: #7a2ccd;
        }

        .button-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--colour-2);
        }

        .hidden {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="dist/css/all.min.css">
    <script src="dist/js/framework.js" defer></script>
</head>
<body class="translate">
    <iframe id="background" src="background.html"></iframe>

    <button class="slide-button">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <!-- Advertising Sidebar -->
    <button class="ad-sidebar-toggle" id="ad-toggle" title="Toggle providers">
        Providers
    </button>
    <aside class="ad-sidebar" id="ad-sidebar">
        <div class="ad-sidebar-header">
            <h3>⚡ Our Providers</h3>
            <span class="ad-sidebar-count" id="ad-count">…</span>
        </div>
        <div class="ad-sidebar-body" id="ad-body">
            <div class="ad-loading">Loading providers…</div>
        </div>
        <div class="ad-sidebar-footer">
            <a href="/providers/">View All Providers →</a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="container">
        <header>
            G4F - Chat
        </header>
        <div class="description">
            <span>Welcome to the G4F Web UI!</span><br>
            <span>Your AI assistant is ready to assist you.</span>
        </div>

        <div class="connected">
            <p><strong>Connected to:</strong><span> </span><span id="connect_status">...</span></p>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <a href="chat/v2" class="button">Start Chat</a>
            <a href="playground/" class="button">Playground</a>
            <a href="#" class="button" id="login-btn">Login</a>
        </div>
        <p id="user-status" class="hidden" style="margin-top: 15px; color: var(--colour-2);"></p>
        <a href="#" class="button hidden" id="logout-btn" style="max-width: 200px;">Logout</a>
        <script type="module">
            // Define appStorage for consistent storage access
            const appStorage = window.localStorage || {
                setItem: (key, value) => self[key] = value,
                getItem: (key) => self[key],
                removeItem: (key) => delete self[key],
                length: 0
            };

            const loginBtn = document.getElementById("login-btn");
            const logoutBtn = document.getElementById("logout-btn");
            const userStatus = document.getElementById("user-status");

            localStorage.removeItem("backendUrl");
            framework.connectToBackend(document.getElementById("connect_status"));

            // Check if user is logged in
            const storedApiKey = appStorage.getItem("g4f_session");
            if (storedApiKey) {
                loginBtn.classList.add("hidden");
                logoutBtn.classList.remove("hidden");
                userStatus.classList.remove("hidden");
                userStatus.textContent = framework.translate("You are logged in");
            }

            // Login button - redirect to members with return URL
            loginBtn.addEventListener("click", (e) => {
                e.preventDefault();
                const returnUrl = encodeURIComponent(location.origin + '/chat/v2');
                window.location.href = `/members.html?redirect=${returnUrl}`;
            });

            // Logout button
            logoutBtn.addEventListener("click", (e) => {
                e.preventDefault();
                appStorage.removeItem("g4f_session");
                loginBtn.classList.remove("hidden");
                logoutBtn.classList.add("hidden");
                userStatus.classList.add("hidden");
            });
        </script>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2026 G4F. All Rights Reserved.</p>
            <p>Powered by the G4F framework</p>
        </div>
    </div>
    <script>
        (async () => {
            const container = document.querySelector('.container');
            const button = document.querySelector('.slide-button');
            const slideIcon = button.querySelector('i');
            button.onclick = () => {
                if (container.classList.contains('slide')) {
                    container.classList.remove('slide');
                    slideIcon.classList.remove('fa-arrow-right');
                    slideIcon.classList.add('fa-arrow-left');
                } else {
                    container.classList.add('slide');
                    slideIcon.classList.remove('fa-arrow-left');
                    slideIcon.classList.add('fa-arrow-right');
                }
            }
        })();

        // ---- Advertising sidebar: load providers ----
        (async () => {
            const sidebar = document.getElementById('ad-sidebar');
            const toggle = document.getElementById('ad-toggle');
            const body = document.getElementById('ad-body');
            const countEl = document.getElementById('ad-count');

            // Toggle sidebar
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                toggle.classList.toggle('collapsed');
            });

            // Build logo URL (same logic as provider detail page)
            function logoUrl(name) {
                return 'https://g4f.space/logo/' + name
                    .replace('MetaAIAccount', 'Facebook AI')
                    .replace('MetaAI', 'Facebook AI')
                    .replace('Aria', '')
                    .replace('OpenAI', 'ChatGPT')
                    .replace('Video', 'TV')
                    .replace('Phi-4', 'Windows')
                    .replace('(Text Generation)', '')
                    .replace('Glhf', 'AI')
                    .replace('GithubCopilot', 'GitHub Copilot')
                    .replace('PerplexityApi', 'Perplexity API')
                    .replace('Gemini', '')
                    .replace('API', '')
                    .replace('-2.5M', '')
                    .replace('grok', 'xAI')
                    .replace('Qwen_Qwen_3', 'Qwen')
                    .replace('Yupp', 'with yupp')
                    .replace('groq', 'Groq');
            }

            try {
                const res = await fetch('/backend-api/v2/providers');
                const providers = await res.json();
                countEl.textContent = providers.length;

                // Shuffle and take first 40 for the sidebar
                const shuffled = [...providers].sort(() => Math.random() - 0.5).slice(0, 40);

                body.innerHTML = shuffled.map(p => {
                    const badges = [];
                    if (p.image) badges.push('<span class="ad-badge image">IMG</span>');
                    if (p.vision) badges.push('<span class="ad-badge vision">VIS</span>');
                    if (p.video) badges.push('<span class="ad-badge video">VID</span>');
                    if (p.audio) badges.push('<span class="ad-badge audio">AUD</span>');
                    if (p.auth) badges.push('<span class="ad-badge auth">AUTH</span>');
                    return `<a class="ad-provider-item" href="/providers/${encodeURIComponent(p.name)}">
                        <img class="ad-provider-logo" src="${logoUrl(p.name)}" alt="${p.name}" loading="lazy" onerror="this.style.opacity=0.3" />
                        <div class="ad-provider-info">
                            <div class="ad-provider-name">${p.label || p.name}</div>
                            <div class="ad-provider-badges">${badges.join('')}</div>
                        </div>
                    </a>`;
                }).join('');
            } catch (e) {
                body.innerHTML = '<div class="ad-loading">Failed to load providers</div>';
            }
        })();
    </script>
<template>You are logged in</template>
<template>Logged in with Hugging Face</template>
</body>
</html>
