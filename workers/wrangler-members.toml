# Wrangler configuration for G4F Members Worker
# See https://developers.cloudflare.com/workers/wrangler/configuration/

name = "auth"
main = "auth-worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for caching user sessions and API key lookups
[[kv_namespaces]]
binding = "MEMBERS_KV"
id = "87b74eadf8124782a9b10dda75a872b6"

# R2 Bucket for persistent user data storage
[[r2_buckets]]
binding = "MEMBERS_BUCKET"
bucket_name = "g4f-members"  # Replace with actual bucket name

# Environment variables (secrets should be set via wrangler secret put)
[vars]
# Official G4F support server (https://discord.gg/qXA4Wf4Fsm). Pinning the
# guild ID avoids a runtime invite lookup when verifying membership.
DISCORD_GUILD_ID = "1307026861037064243"
DISCORD_GUILD_NAME = "g4f support"

# OAuth credentials (set as secrets)
# wrangler secret put GITHUB_CLIENT_ID
# wrangler secret put GITHUB_CLIENT_SECRET
# wrangler secret put DISCORD_CLIENT_ID
# wrangler secret put DISCORD_CLIENT_SECRET
# The support guild is pinned in [vars] above; remove those values to resolve
# the guild ID from the public invite at runtime instead.
# wrangler secret put HUGGINGFACE_CLIENT_ID
# wrangler secret put HUGGINGFACE_CLIENT_SECRET
# wrangler secret put GITHUB_TOKEN

# Routes - configure these to match your domain
routes = [
  { pattern = "g4f.dev/members/*", zone_name = "g4f.dev" },
  { pattern = "auth.g4f.space/v1/secret/*", zone_name = "g4f.space" },
  { pattern = "auth.g4f.space/members/*", zone_name = "g4f.space" }
]

# Scheduled triggers for tier updates
[triggers]
crons = ["0 * * * *"]  # Run every hour

# Development settings
[dev]
port = 8787

# Production environment overrides
[env.production]
# Add production-specific settings here
