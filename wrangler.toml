# Root Wrangler configuration for g4f.space.
#
# This is the config used by:
#
#   npx wrangler deploy
#
# from the repository root. It deploys ONE Worker (`api`) whose router entry
# point dispatches to the API, auth/members, Puter, Pollinations, and Ollama
# worker modules.
# That avoids Wrangler's automatic static-site detection, which treated the
# repository root as an assets directory and failed with:
#
#   ✘ [ERROR] Asset too large.
#
# There is intentionally no [assets] section here. The static site is deployed
# to GitHub Pages; the Workers are code-only.
#
# For split deployments (one Worker per provider), use the configs in
# `workers/wrangler-*.toml` with `--config`, but do not attach the routes below
# to two different Workers at the same time.

name = "api"
main = "workers/g4f-space-router.js"
compatibility_date = "2025-05-30"

# The deployed g4f.space Workers use custom domains, so keep the same shape
# here. Using `pattern = "host/*", zone_name = ...` instead would make the
# deploy review try to replace those custom domains with plain routes.
routes = [
  { pattern = "g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "www.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "api.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "auth.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "puter.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "pollinations.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "community.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "ollama.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "openrouter.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "groq.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "nvidia.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "huggingface.g4f.space", custom_domain = true, enabled = true, previews_enabled = false },
  { pattern = "gemini.g4f.space", custom_domain = true, enabled = true, previews_enabled = false }
]

# KV Namespace (shared with the auth/members worker for auth and server index)
[[kv_namespaces]]
binding = "MEMBERS_KV"
id = "87b74eadf8124782a9b10dda75a872b6"

# KV Namespace shared with the cake worker. Optional: uncomment after creating
# it with `npx wrangler kv namespace create CAKE_KV` and replacing the id. The
# API worker degrades gracefully when CAKE_KV is absent.
# [[kv_namespaces]]
# binding = "CAKE_KV"
# id = "<CAKE_KV_NAMESPACE_ID>"

# D1 database for error tracking (error_logs table).
[[d1_databases]]
binding = "ERRORS_DB"
database_name = "errors_db"
database_id = "5028af48-43c0-4520-a094-b51b08f8ffae"

# R2 bucket for server data storage (shared with the members worker).
[[r2_buckets]]
binding = "MEMBERS_BUCKET"
bucket_name = "g4f-members"

# D1 database for usage logs (usage_logs table).
[[d1_databases]]
binding = "USAGE_DB"
database_id = "d48cfe96-5452-4995-aa2d-58c0ec60045f"

[vars]
API_KEY_SALT = ""  # Set via: npx wrangler secret put API_KEY_SALT
# Canonical provider worker endpoints used for aggregated /v1 routing. They
# resolve back to this Worker's router on the provider subdomains.
PUTER_WORKER_URL = "https://puter.g4f.space"
POLLINATIONS_WORKER_URL = "https://pollinations.g4f.space"
OLLAMA_WORKER_URL = "https://ollama.g4f.space"
# Account key kept at the minimum pollen budget by the scheduled trigger.
POLLINATIONS_KEY_ID = "udAgkmDyDv1RhpHWrF2Az9insQWi0Q3X"
POLLINATIONS_MIN_POLLEN_BUDGET = "0.00001"

# Refresh the public servers index every 15 minutes; hourly runs also prune
# the D1 tables. The same trigger pins the Pollinations key budget.
[triggers]
crons = ["*/15 * * * *"]

[dev]
port = 8788

[observability]
enabled = true
